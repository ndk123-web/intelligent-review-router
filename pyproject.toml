[project]
name = "ecommerce-review-router"
version = "0.1.0"
description = "NLP-based e-commerce customer review analyzer and support router"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "accelerate>=1.15.0",
    "datasets>=5.0.1",
    "fastapi>=0.141.1",
    "ipykernel>=7.3.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pandas>=3.0.5",
    "pyspark>=4.2.0",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "sqlalchemy>=2.0.52",
    "streamlit>=1.63.0",
    "spacy>=3.8.0",
    "torch",
    "torchvision",
    "transformers>=5.17.0",
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }
